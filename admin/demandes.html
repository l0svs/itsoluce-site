<!doctype html>
<html lang="fr" data-mode="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IT Soluce ERP — Demandes du formulaire</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon_io/favicon.ico">
<script src="/assets/js/admin-security.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
:root{--a:#3b82f6;--ad:rgba(59,130,246,0.12);--bg:#0c0d0f;--bg2:#111214;--bg3:#18191c;--bg4:#1f2023;--ln:rgba(255,255,255,0.06);--ln2:rgba(255,255,255,0.1);--t1:#e8e8e8;--t2:#8a8f98;--t3:#4b5059;--ok:#34d399;--w:#fbbf24;--d:#f87171;--sw:220px;--th:48px;}
[data-mode="light"]{--bg:#f8f8f8;--bg2:#fff;--bg3:#f2f2f4;--bg4:#eaeaec;--ln:rgba(0,0,0,0.06);--ln2:rgba(0,0,0,0.1);--t1:#111114;--t2:#52525b;--t3:#a1a1aa;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
.topbar{height:var(--th);background:var(--bg2);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100;}
.logo{display:flex;align-items:center;gap:7px;text-decoration:none;flex-shrink:0;}.logo-m{font-size:17px;font-weight:600;color:var(--a);letter-spacing:-1px;}.logo-sep{width:1px;height:14px;background:var(--ln2);}.logo-s{font-size:11px;font-weight:500;color:var(--t3);letter-spacing:2px;}
.tb-crumb{font-size:12px;color:var(--t3);flex:1;display:flex;align-items:center;gap:6px;}.tb-crumb a{color:var(--t3);text-decoration:none;}.tb-crumb a:hover{color:var(--a);}.tb-crumb span{color:var(--t2);}
.mstrip{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--ln2);border-radius:6px;padding:3px;gap:1px;}
.mbtn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:none;cursor:pointer;border-radius:4px;color:var(--t3);transition:all .12s;}.mbtn:hover{color:var(--t1);background:var(--bg4);}.mbtn.on{background:var(--ad);color:var(--a);}
.mbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.upill{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border:1px solid var(--ln2);border-radius:99px;background:var(--bg3);font-size:12px;color:var(--t2);}
.uav{width:22px;height:22px;border-radius:50%;background:var(--ad);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.bout{padding:5px 10px;border:1px solid var(--ln2);border-radius:5px;background:none;color:var(--t3);font-size:11px;font-family:inherit;cursor:pointer;transition:all .12s;}.bout:hover{color:var(--d);border-color:var(--d);}
.layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:var(--sw);background:var(--bg2);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:8px 0;display:none;}
.hnav{display:flex;align-items:center;gap:4px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--ln);flex-shrink:0;position:relative;}
.hnl{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;font-size:13px;color:var(--t2);text-decoration:none;cursor:pointer;border:none;background:none;font-family:inherit;white-space:nowrap;transition:all .1s;}
.hnl:hover{background:var(--bg3);color:var(--t1);}
.hnl.active{background:var(--ad);color:var(--a);}
.hnl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.hnl .chev{width:11px;height:11px;margin-left:1px;transition:transform .15s;}
.hnl.open .chev{transform:rotate(180deg);}
.hnav-drop{position:relative;}
.hnav-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--bg2);border:1px solid var(--ln2);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.24);min-width:230px;padding:8px;display:none;flex-direction:column;gap:2px;z-index:250;}
.hnav-menu.open{display:flex;animation:hnavIn .16s ease;}
@keyframes hnavIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.hnav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--t2);text-decoration:none;transition:background .12s;}
.hnav-item:hover{background:var(--bg3);color:var(--t1);}
.hnav-item.active{background:var(--ad);color:var(--a);font-weight:500;}
.hnav-item-ico{width:28px;height:28px;border-radius:8px;background:var(--bg3);color:var(--t3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hnav-item.active .hnav-item-ico{background:var(--bg4);color:var(--a);}
.hnav-item-ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.hnav-item .nc{margin-left:auto;font-size:10px;font-weight:600;min-width:16px;height:15px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--bg4);color:var(--t3);padding:0 4px;}
@media(max-width:900px){.hnav{display:none;}}

.ng{padding:14px 10px 4px;}.ngl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;padding:0 6px;margin-bottom:3px;}
.nl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:13px;color:var(--t2);text-decoration:none;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:all .1s;margin-bottom:1px;}
.nl:hover{background:var(--bg3);color:var(--t1);}.nl.active{background:var(--ad);color:var(--a);}
.nl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.75;}.nl.active svg{opacity:1;}
.nc{margin-left:auto;font-size:10px;font-weight:600;min-width:18px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--bg4);color:var(--t3);padding:0 4px;}
.nhr{height:1px;background:var(--ln);margin:8px 10px;}.sf{margin-top:auto;padding:10px 16px;border-top:1px solid var(--ln);font-size:10px;color:var(--t3);}

/* ═══════════════════════════════════════════════════════════════
   DEMANDES — « fiches complètes ».
   Quelques demandes par mois : rien n'est caché derrière un clic.
   Chaque demande est une fiche entière, description comprise, avec
   ses actions dessus. Pas de tableau, pas de panneau latéral.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#f5f5f7; --bg2:#ffffff; --bg3:#f0f0f3; --bg4:#e6e6ea;
  --ln:#e6e6e9; --ln2:#d2d2d7;
  --t1:#1d1d1f; --t2:#6e6e73; --t3:#a1a1a6;
  --ok:#1a8a52; --w:#b25e09; --d:#c8362c;
  --radius:16px;
}
body{font-size:14px;}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{height:52px; padding:0 22px; background:rgba(255,255,255,.88); -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);}
[data-mode="dark"] .topbar{background:rgba(28,28,30,.82);}
.hnav .hnl{border-radius:8px; font-size:12.5px;}
.hnav .hnl.active{background:var(--ad); color:var(--a);}
.sidebar .nl{border-radius:9px; margin:0 8px 2px; padding:8px 10px;}

.page-head{padding:26px 28px 0; display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; flex-shrink:0;}
.ph-left h1{font-size:27px; font-weight:600; letter-spacing:-.03em; color:var(--t1);}
.ph-resume{font-size:13.5px; color:var(--t2); margin-top:4px;}
.ph-resume b{color:var(--t1); font-weight:600;}
.ph-resume .alerte{color:var(--w); font-weight:600;}
.ph-right{display:flex; gap:8px; flex-wrap:wrap;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; cursor:pointer;
  font-family:inherit; border-radius:980px; padding:9px 17px; font-size:13px; font-weight:500; line-height:1.2; transition:.15s;}
.btn svg{width:14px; height:14px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.btn-primary{background:var(--a); color:#fff;} .btn-primary:hover{opacity:.88;}
.btn-secondary{background:var(--bg3); color:var(--t1); border:1px solid var(--ln);}
.btn-secondary:hover{background:var(--bg4);}
.btn-danger{background:rgba(200,54,44,.1); color:var(--d); border:1px solid rgba(200,54,44,.2);}
.btn-danger:hover{background:rgba(200,54,44,.18);}
.btn:disabled{opacity:.45; cursor:default;}

/* ── Barre d'outils ── */
.tools{display:flex; align-items:center; gap:10px; padding:16px 28px 0; flex-wrap:wrap; flex-shrink:0;}
.srch-wrap{position:relative; flex:1; min-width:190px; max-width:300px;}
.srch-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--t3); fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none;}
.srch-wrap input{width:100%; background:var(--bg2); border:1px solid transparent; border-radius:11px; padding:9px 12px 9px 34px; font-family:inherit; font-size:13px; color:var(--t1); outline:none; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:.14s;}
.srch-wrap input:focus{border-color:var(--a); box-shadow:0 0 0 3px var(--ad);}
.srch-wrap input::placeholder{color:var(--t3);}
.segf{display:flex; background:var(--bg3); border:1px solid var(--ln); border-radius:10px; padding:3px; gap:2px; max-width:100%; overflow-x:auto; scrollbar-width:none;}
.segf::-webkit-scrollbar{display:none;}
.segf button{border:none; background:none; font-family:inherit; font-size:12.5px; color:var(--t2); padding:6px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; flex-shrink:0;}
.segf button:hover{color:var(--t1);}
.segf button.on{background:var(--bg2); color:var(--t1); font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.07);}

/* ── Liste de fiches ── */
.zone{flex:1; overflow-y:auto; padding:18px 28px 32px;}
.fl{display:flex; flex-direction:column; gap:13px; max-width:920px;}

.fiche{background:var(--bg2); border-radius:var(--radius); padding:17px 20px 18px; box-shadow:0 1px 2px rgba(0,0,0,.05); border-left:3px solid transparent;}
.fiche.st-nouveau{border-left-color:var(--a);}
.fiche.st-converti{border-left-color:var(--ok);}
.fiche.st-traite{opacity:.82;}
.fiche.st-traite:hover{opacity:1;}

.fiche-h{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.fiche-h b{font-size:16px; font-weight:600; letter-spacing:-.02em; color:var(--t1);}
.fiche-h .quand{margin-left:auto; font-size:12px; color:var(--t3); white-space:nowrap;}
.tag{font-size:10.5px; font-weight:500; padding:3px 9px; border-radius:980px; white-space:nowrap;}
.t-nouveau{background:var(--ad); color:var(--a);}
.t-traite{background:var(--bg3); color:var(--t2);}
.t-converti{background:rgba(26,138,82,.11); color:var(--ok);}
[data-mode="dark"] .t-converti{background:rgba(52,211,153,.16);}
.canal{font-size:11.5px; color:var(--t3);}

.fiche-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:11px 18px; font-size:13px; margin-bottom:12px;}
.fiche-grid > div{min-width:0;}
.fiche-grid .k{display:block; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--t3); margin-bottom:2px;}
.fiche-grid a{color:var(--a); text-decoration:none; word-break:break-word;}
.fiche-grid a:hover{text-decoration:underline;}
.fiche-grid .val{color:var(--t1); word-break:break-word;}

.panne{font-size:13.5px; line-height:1.6; color:var(--t1); background:var(--bg3); border-radius:11px; padding:12px 14px; white-space:pre-wrap; word-break:break-word; margin-bottom:13px;}
.fiche-acts{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.fiche-acts .btn{flex:0 1 auto;}
.fiche-acts .espace{margin-left:auto;}
.lien-rep{font-size:12.5px; color:var(--ok); font-weight:500; text-decoration:none;}
.lien-rep:hover{text-decoration:underline;}
.mail-etat{font-size:12px; color:var(--t3);}
.mail-etat.ok{color:var(--ok);}
.mail-etat.ko{color:var(--w);}

/* ── État vide ── */
.vide{background:var(--bg2); border-radius:var(--radius); padding:50px 24px; text-align:center; box-shadow:0 1px 2px rgba(0,0,0,.05); max-width:920px;}
.vide-ico{width:52px; height:52px; border-radius:15px; background:var(--ad); color:var(--a); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.vide-ico svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.vide h3{font-size:15px; font-weight:600; color:var(--t1); margin-bottom:6px;}
.vide p{font-size:13px; color:var(--t2); line-height:1.6; max-width:46ch; margin:0 auto;}
.vide p a{color:var(--a); text-decoration:none;}

/* ── Toast et chargement ── */
.toast{position:fixed; bottom:22px; right:22px; background:var(--bg2); border:1px solid var(--ln2); border-radius:12px; padding:11px 17px; font-size:13px; color:var(--t1); box-shadow:0 10px 30px rgba(0,0,0,.14); z-index:999; transform:translateY(20px); opacity:0; transition:all .25s; pointer-events:none; max-width:min(380px,calc(100vw - 44px));}
.toast.show{transform:translateY(0); opacity:1;}
.toast.ok{border-color:rgba(26,138,82,.34); color:var(--ok);}
.toast.err{border-color:rgba(200,54,44,.34); color:var(--d);}
.loader{display:flex; align-items:center; justify-content:center; height:100%; gap:9px; font-size:13px; color:var(--t3);}
.spin{width:15px; height:15px; border:1.6px solid var(--ln2); border-top-color:var(--a); border-radius:50%; animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:640px){
  .sidebar{display:none;}
  .page-head{padding:20px 16px 0;}
  .tools{padding:12px 16px 0;}
  .zone{padding:14px 16px 24px;}
  .fiche{padding:15px 16px 16px;}
  .fiche-h .quand{margin-left:0; flex-basis:100%;}
  .fiche-grid{grid-template-columns:1fr 1fr;}
  .fiche-acts .btn{flex:1 1 100%;}
  .fiche-acts .espace{margin-left:0;}
}


/* ═══ SYSTÈME MOBILE ERP ═══ */
.mobile-menu-btn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--ln2);border-radius:9px;background:var(--bg3);color:var(--t1);cursor:pointer;flex-shrink:0;}
.mobile-menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;opacity:0;transition:opacity .2s;}
.mobile-overlay.open{display:block;opacity:1;}
.mobile-nav{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--bg2);z-index:401;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding:16px 0;box-shadow:2px 0 20px rgba(0,0,0,.3);}
.mobile-nav.open{transform:translateX(0);}
.mobile-nav-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px 16px;border-bottom:1px solid var(--ln);margin-bottom:12px;}
.mobile-nav-head img{height:30px;border-radius:6px;}
.mobile-nav-close{width:32px;height:32px;border:none;background:var(--bg3);border-radius:8px;color:var(--t2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mobile-bottombar{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg2);border-top:1px solid var(--ln);z-index:300;padding-bottom:env(safe-area-inset-bottom);}
.mobile-bottombar-inner{display:flex;height:60px;}
.mbb-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t3);text-decoration:none;font-size:9px;font-weight:500;transition:color .12s;}
.mbb-item.active{color:var(--a);}
.mbb-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}

@media(max-width:640px){
  .mobile-menu-btn{display:flex;}
  .mobile-bottombar{display:block;}
  .content{padding-bottom:70px !important;}
  .tb-crumb{display:none !important;}
  .upill span{display:none !important;}
  .topbar{padding:0 12px !important;gap:8px !important;}
  .mstrip{display:none !important;}
  .content{padding-left:14px !important;padding-right:14px !important;}
  .page-head{flex-wrap:wrap;gap:10px;}
  .page-head h1{font-size:19px !important;}
  .btn,button.btn{min-height:40px;}
  .kpi-strip{flex-wrap:wrap !important;gap:8px !important;}
  .kpi{flex:1 1 calc(50% - 4px) !important;min-width:0 !important;}
  .panel{width:100% !important;max-width:100% !important;min-width:0 !important;}
  .table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
}

/* ── NAV ÉTALÉE (une seule barre en haut, répartition style Apple) ── */
.topbar{gap:0;padding:0 22px;}
.topbar .logo{margin-right:10px;}
.tb-crumb{display:none;}
.hnav{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-evenly;gap:0;padding:0 18px;background:none;border-bottom:none;}
.hnav .hnl{padding:7px 14px;}
@media(max-width:1200px){.hnav{padding:0 6px;}.hnav .hnl{padding:7px 10px;}}
@media(max-width:900px){.hnav{display:none;}}

/* ── NAV À PLAT : les 15 pages directement dans la barre ── */
/* Paliers calés sur mesure : la nav ne doit jamais déborder entre 900px
   (en dessous elle laisse place au hamburger) et les grands écrans. */
.hnav{gap:0;justify-content:space-between;padding:0 12px;}
.hnav .hnl{padding:6px 10px;font-size:13px;gap:5px;border-radius:6px;}
.hnav .hnl .nc{margin-left:0;min-width:17px;height:14px;font-size:9px;padding:0 3px;font-variant-numeric:tabular-nums;}
@media(max-width:1500px){.hnav{padding:0 8px;}.hnav .hnl{padding:6px 7px;font-size:12.5px;}}
@media(max-width:1340px){.hnav{padding:0 4px;}.hnav .hnl{padding:6px 5px;font-size:12px;}}
@media(max-width:1240px){.hnav .hnl{padding:5px 4px;font-size:11.5px;}.hnav .hnl .nc{display:none;}}
@media(max-width:1100px){.hnav{padding:0 2px;}.hnav .hnl{padding:5px 3px;font-size:11px;letter-spacing:-.2px;}}
/* Sous ~1000px les 15 onglets ne tiennent plus : la barre défile
   horizontalement au lieu de disparaître. Corrige au passage une zone morte
   préexistante — entre 641 et 900px, la nav était masquée alors que le
   hamburger n'apparaît qu'à 640px : aucune navigation n'était affichée. */
@media(max-width:1000px) and (min-width:641px){
  .hnav{display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .hnav::-webkit-scrollbar{display:none;}
  .hnav .hnl{flex-shrink:0;}
}
</style>
<style id="voile-nav">.hnav,.sidebar{visibility:hidden}</style>
<script>
/* Les liens de navigation sont écrits dans le HTML, mais les pages
   autorisées ne sont connues qu'après un aller-retour avec Supabase.
   Sans ce voile, l'utilisateur voit fugitivement toutes les pages, y compris
   celles qui lui sont interdites, avant qu'elles ne disparaissent.
   La navigation garde sa place (visibility, pas display) : rien ne saute.
   Le délai est un filet de sécurité — si le script de page ne s'exécute
   jamais, la navigation réapparaît quand même plutôt que de rester vide. */
setTimeout(function(){var v=document.getElementById('voile-nav');if(v)v.remove()},4000);
</script>
</head>
<body>
<header class="topbar">
  <button class="mobile-menu-btn" onclick="openMobileNav()" aria-label="Menu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

  <a href="/admin/dashboard.html" class="logo"><img src="https://itsoluce.be/img/logo-full.png" alt="IT Soluce" style="height:28px;width:auto;display:block;"/></a>
  <div class="tb-crumb">

<script>
/* Thème et accent — mêmes valeurs que les autres pages refondues. */
const ACCENT_DEFAUT='#0052CC'
const root=document.documentElement
function hex2rgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))h='0052cc';return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function eclaircir(hex,ratio){const [r,g,b]=hex2rgb(hex);return rgb2hex(r+(255-r)*ratio,g+(255-g)*ratio,b+(255-b)*ratio)}
let accentBase=localStorage.getItem('erp-accent')||localStorage.getItem('erp-a')||ACCENT_DEFAUT
function applyAccent(base){
  accentBase=base||ACCENT_DEFAUT
  const sombre=root.getAttribute('data-mode')==='dark'
  const utilise=sombre?eclaircir(accentBase,.34):accentBase
  const [r,g,b]=hex2rgb(utilise)
  root.style.setProperty('--a',utilise)
  root.style.setProperty('--ad',`rgba(${r},${g},${b},${sombre?.20:.12})`)
}
function applyMode(m){
  const h=new Date().getHours()
  const eff=(m==='auto')?((h>=7&&h<20)?'light':'dark'):m
  root.setAttribute('data-mode',eff)
  const clair=eff==='light', v=(a,b)=>clair?a:b, s=(k,val)=>root.style.setProperty(k,val)
  s('--bg', v('#f5f5f7','#0d0d0f'));  s('--bg2',v('#ffffff','#1c1c1e'))
  s('--bg3',v('#f0f0f3','#2c2c2e'));  s('--bg4',v('#e6e6ea','#3a3a3c'))
  s('--ln', v('#e6e6e9','rgba(255,255,255,0.09)')); s('--ln2',v('#d2d2d7','rgba(255,255,255,0.15)'))
  s('--t1', v('#1d1d1f','#f5f5f7'));  s('--t2', v('#6e6e73','#98989d')); s('--t3', v('#a1a1a6','#6a6a6e'))
  s('--ok', v('#1a8a52','#34d399'));  s('--w',  v('#b25e09','#fbbf24'));  s('--d',  v('#c8362c','#f87171'))
  applyAccent(accentBase)
}
function setMode(m){try{localStorage.setItem('erp-m',m)}catch(e){};applyMode(m)}
applyMode(localStorage.getItem('erp-m')||'auto')
setInterval(()=>{if((localStorage.getItem('erp-m')||'auto')==='auto')applyMode('auto')},60000)

function showToast(msg,type='ok'){
  const t=document.getElementById('toast')
  t.textContent=msg
  t.className='toast show '+(type==='err'?'err':'ok')
  setTimeout(()=>t.className='toast',3400)
}
</script>

function jours(iso){
  const d=new Date(iso)
  return isNaN(d)?null:Math.floor((Date.now()-d.getTime())/86400000)
}
function quand(iso){
  const d=new Date(iso)
  if(isNaN(d))return '—'
  const n=jours(iso)
  const heure=d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})
  const date=d.toLocaleDateString('fr-BE',{day:'numeric',month:'long'})
  if(n===0)return `aujourd'hui à ${heure}`
  if(n===1)return `hier à ${heure}`
  if(n<31)return `${date} · il y a ${n} jours`
  return d.toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'})
}

let allDemandes=[]
let activeFilter='a_traiter'

function statutOf(d){
  if(d.converti_reparation_id)return 'converti'
  if(!d.vue)return 'nouveau'
  return 'traite'
}

async function load(){
  const {data,error,count}=await sb.from('demandes_formulaire')
    .select('*',{count:'exact'})
    .order('created_at',{ascending:false})
    .limit(2000)
  if(error)throw new Error(error.message)
  allDemandes=data||[]
  if(typeof count==='number'&&count>allDemandes.length){
    showToast(`Seules ${allDemandes.length} demandes sur ${count} ont été chargées.`,'err')
  }
  renderAll()
  document.getElementById('ldr').style.display='none'
  document.getElementById('pageBody').style.display='flex'
}

function renderAll(){majResume();renderFilters();renderTable()}

function majResume(){
  const el=document.getElementById('ph-resume')
  const aTraiter=allDemandes.filter(d=>statutOf(d)==='nouveau')
  const convertis=allDemandes.filter(d=>statutOf(d)==='converti').length
  const traites=allDemandes.filter(d=>statutOf(d)==='traite').length
  if(!allDemandes.length){
    el.textContent='Aucune demande reçue pour le moment. Elles arriveront ici dès qu’un visiteur remplira le formulaire du site.'
  }else{
    const bouts=[`<b>${aTraiter.length} demande${aTraiter.length>1?'s':''} à traiter</b>`]
    if(aTraiter.length){
      const plusVieille=Math.max(...aTraiter.map(d=>jours(d.created_at)??0))
      if(plusVieille>=2)bouts.push(`<span class="alerte">la plus ancienne attend depuis ${plusVieille} jours</span>`)
    }
    if(convertis)bouts.push(`${convertis} transformée${convertis>1?'s':''} en dossier`)
    if(traites)bouts.push(`${traites} sans suite`)
    if(bouts.length===1)bouts.push(`${allDemandes.length} au total`)
    el.innerHTML=bouts.join(' · ')
  }
  // Pastille « Demandes » de la navigation
  document.querySelectorAll('#nb-dem').forEach(x=>{
    x.textContent=aTraiter.length
    x.style.display=aTraiter.length?'':'none'
  })
}

const FILTRES=[
  {cle:'a_traiter', label:'À traiter'},
  {cle:'toutes',    label:'Toutes'},
  {cle:'traite',    label:'Sans suite'},
  {cle:'converti',  label:'Transformées'}
]
function renderFilters(){
  document.getElementById('filterBtns').innerHTML=FILTRES.map(f=>
    `<button class="${activeFilter===f.cle?'on':''}" onclick="setFilter('${f.cle}')">${f.label}</button>`
  ).join('')
}
window.setFilter=function(f){activeFilter=f;renderFilters();renderTable()}

const ETATS={
  nouveau: {label:'À traiter',  cls:'t-nouveau'},
  traite:  {label:'Sans suite', cls:'t-traite'},
  converti:{label:'Transformée',cls:'t-converti'}
}

function fiche(d){
  const s=statutOf(d)
  const e=ETATS[s]
  const nom=[d.prenom,d.nom].filter(Boolean).join(' ')||'Sans nom'
  const mode=MODE_LABELS[d.mode_intervention]||d.mode_intervention||'—'
  const modeComplet=d.mode_intervention==='domicile'&&d.adresse
    ? `${mode} — ${escHtml(d.adresse)}`
    : escHtml(mode)
  const tel=d.telephone?String(d.telephone).replace(/\s/g,''):''
  const mail=d.email_confirmation_envoye
    ? '<span class="mail-etat ok">Accusé de réception envoyé</span>'
    : '<span class="mail-etat ko">Accusé de réception non parti</span>'
  const actions=s==='converti'
    ? `<a class="lien-rep" href="/admin/reparations.html">Voir le dossier de réparation</a>
       <span class="espace"></span>
       <button class="btn btn-danger" onclick="supprimer(${d.id})">Supprimer</button>`
    : `<button class="btn btn-secondary" onclick="toggleVue(${d.id})">${d.vue?'Remettre à traiter':'Classer sans suite'}</button>
       <button class="btn btn-primary" onclick="transformer(${d.id})">Transformer en réparation</button>
       <span class="espace"></span>
       <button class="btn btn-danger" onclick="supprimer(${d.id})">Supprimer</button>`
  return `<article class="fiche st-${s}">
    <div class="fiche-h">
      <span class="tag ${e.cls}">${e.label}</span>
      <b>${escHtml(nom)}</b>
      <span class="canal">formulaire du site</span>
      <span class="quand">${quand(d.created_at)}</span>
    </div>
    <div class="fiche-grid">
      <div><span class="k">Email</span>${d.email?`<a href="mailto:${escHtml(d.email)}">${escHtml(d.email)}</a>`:'<span class="val">—</span>'}</div>
      <div><span class="k">Téléphone</span>${tel?`<a href="tel:${escHtml(tel)}">${escHtml(d.telephone)}</a>`:'<span class="val">—</span>'}</div>
      <div><span class="k">Appareil</span><span class="val">${escHtml(d.appareil||'—')}</span></div>
      <div><span class="k">Intervention</span><span class="val">${modeComplet}</span></div>
    </div>
    <div class="panne">${escHtml(d.description||'—')}</div>
    <div class="fiche-acts">${actions}</div>
    <div style="margin-top:9px;">${mail}</div>
  </article>`
}

// Exposée globalement : la recherche l'appelle depuis un attribut oninput,
// qui ne voit pas la portée du module.
window.renderTable=function renderTable(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim()
  const rows=allDemandes.filter(d=>{
    const s=statutOf(d)
    let okF=true
    if(activeFilter==='a_traiter')okF=s==='nouveau'
    else if(activeFilter!=='toutes')okF=s===activeFilter
    const nom=[d.prenom,d.nom].filter(Boolean).join(' ')
    const okQ=!q||[nom,d.email,d.telephone,d.appareil,d.description,d.adresse]
      .some(v=>v&&String(v).toLowerCase().includes(q))
    return okF&&okQ
  })
  const wrap=document.getElementById('listeDemandes')
  if(!rows.length){
    const vide=allDemandes.length===0
    wrap.innerHTML=`<div class="vide">
      <div class="vide-ico"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
      <h3>${vide?'Aucune demande reçue':'Aucune demande ne correspond'}</h3>
      <p>${vide
        ? 'Les demandes remplies sur <a href="https://itsoluce.be" target="_blank" rel="noopener">itsoluce.be</a> arrivent directement ici. Rien à faire en attendant.'
        : 'Essaie un autre terme de recherche ou change de filtre.'}</p>
    </div>`
    return
  }
  wrap.innerHTML=rows.map(fiche).join('')
}

window.toggleVue=async function(id){
  const d=allDemandes.find(x=>x.id===id)
  if(!d)return
  const {error}=await sb.from('demandes_formulaire').update({vue:!d.vue}).eq('id',id)
  if(error){showToast('Erreur : '+error.message,'err');return}
  d.vue=!d.vue
  renderAll()
  showToast(d.vue?'Demande classée sans suite':'Demande remise à traiter','ok')
}

window.supprimer=async function(id){
  const d=allDemandes.find(x=>x.id===id)
  const nom=d?[d.prenom,d.nom].filter(Boolean).join(' '):''
  if(!confirm(`Supprimer définitivement la demande de ${nom||'ce visiteur'} ?`))return
  const {error}=await sb.from('demandes_formulaire').delete().eq('id',id)
  if(error){showToast('Erreur : '+error.message,'err');return}
  allDemandes=allDemandes.filter(x=>x.id!==id)
  renderAll()
  showToast('Demande supprimée','ok')
}

/* Numérotation client : même format que partout ailleurs dans l'ERP.
   Le compteur n'est pas atomique côté PostgREST, le numéro est donc
   vérifié avant d'être attribué. */
async function nextNumeroClient(){
  for(let essai=0;essai<5;essai++){
    const {data:cpt}=await sb.from('compteurs').select('valeur').eq('cle','client').single()
    const valeur=(cpt?.valeur||0)+1
    await sb.from('compteurs').update({valeur}).eq('cle','client')
    const numero=`CLI-${String(valeur).padStart(4,'0')}`
    const {count}=await sb.from('clients').select('id',{count:'exact',head:true}).eq('numero',numero)
    if(!count)return numero
  }
  return `CLI-${Date.now().toString().slice(-6)}`
}

/* Transformation en dossier réparation. Ne se déclenche jamais
   automatiquement : uniquement sur clic explicite. */
window.transformer=async function(id){
  const d=allDemandes.find(x=>x.id===id)
  if(!d)return
  if(d.converti_reparation_id){showToast('Cette demande a déjà été transformée','err');return}
  const nomComplet=[d.prenom,d.nom].filter(Boolean).join(' ')||'Client site web'
  if(!confirm(`Créer un dossier de réparation pour ${nomComplet} ?`))return

  const boutons=[...document.querySelectorAll(`button[onclick="transformer(${id})"]`)]
  boutons.forEach(b=>{b.disabled=true;b.textContent='Création…'})
  try{
    let clientId=null
    if(d.email){
      const {data:existant}=await sb.from('clients').select('id').eq('email',d.email).limit(1).maybeSingle()
      if(existant)clientId=existant.id
    }
    if(!clientId){
      const {data:nouveau,error:errCli}=await sb.from('clients').insert({
        numero:await nextNumeroClient(),
        nom:nomComplet,
        email:d.email||null,
        telephone:d.telephone||null,
        type:'particulier',
        updated_at:new Date().toISOString()
      }).select('id').single()
      if(errCli)throw errCli
      clientId=nouveau.id
    }

    const modeLabel=MODE_LABELS[d.mode_intervention]||d.mode_intervention
    const notes=[
      modeLabel?`Intervention souhaitée : ${modeLabel}`:null,
      d.adresse?`Adresse : ${d.adresse}`:null,
      `Demande reçue via le formulaire du site le ${new Date(d.created_at).toLocaleDateString('fr-BE')}`
    ].filter(Boolean).join('\n')

    const {data:rep,error:errRep}=await sb.from('reparations').insert({
      client_id:clientId,
      client_nom:nomComplet,
      client_email:d.email||null,
      client_telephone:d.telephone||null,
      appareil:d.appareil||null,
      panne_description:d.description||null,
      statut:'attente_reception',
      prix_devis:0, prix_final:0,
      notes:notes||null,
      updated_at:new Date().toISOString()
    }).select('id').single()
    if(errRep)throw errRep

    const {error:errMaj}=await sb.from('demandes_formulaire')
      .update({converti_reparation_id:rep.id,vue:true}).eq('id',id)
    if(errMaj)throw errMaj
    d.converti_reparation_id=rep.id
    d.vue=true

    renderAll()
    showToast('Dossier de réparation créé','ok')
    setTimeout(()=>{window.location.href='/admin/reparations.html'},700)
  }catch(err){
    console.error(err)
    boutons.forEach(b=>{b.disabled=false;b.textContent='Transformer en réparation'})
    showToast('Erreur : '+(err.message||err),'err')
  }
}

window.exportCSV=function(){
  if(!allDemandes.length){showToast('Aucune donnée à exporter','err');return}
  const cols=['created_at','prenom','nom','email','telephone','appareil','mode_intervention','adresse','description','vue','email_confirmation_envoye','converti_reparation_id']
  const cell=v=>v===null||v===undefined?'""':'"'+String(v).replace(/"/g,'""')+'"'
  const csv=[cols.join(';'),...allDemandes.map(d=>cols.map(c=>cell(d[c])).join(';'))].join('\r\n')
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'})
  const url=URL.createObjectURL(blob)
  const a=document.createElement('a')
  const j=new Date()
  a.href=url
  a.download=`itsoluce_demandes_${j.getFullYear()}-${String(j.getMonth()+1).padStart(2,'0')}-${String(j.getDate()).padStart(2,'0')}.csv`
  a.click()
  setTimeout(()=>URL.revokeObjectURL(url),1000)
  showToast('Export téléchargé','ok')
}

window.doLogout=async()=>{await sb.auth.signOut();window.location.href='/admin/login.html'}

await load()

} catch(err){
  console.error('Erreur demandes :',err)
  showError(err.message||'Une erreur inattendue est survenue.')
}
</script>

<script>
function openMobileNav(){
  let ov=document.getElementById('mobileOverlay');
  let nav=document.getElementById('mobileNav');
  if(!nav){
    const sb=document.querySelector('.sidebar');
    ov=document.createElement('div');ov.id='mobileOverlay';ov.className='mobile-overlay';ov.onclick=closeMobileNav;
    nav=document.createElement('div');nav.id='mobileNav';nav.className='mobile-nav';
    const head=document.createElement('div');head.className='mobile-nav-head';
    head.innerHTML='<img src="https://itsoluce.be/favicon_io/android-chrome-512x512.png" alt="IT Soluce"/><button class="mobile-nav-close" onclick="closeMobileNav()">&times;</button>';
    nav.appendChild(head);
    if(sb){const clone=sb.cloneNode(true);clone.style.display='block';clone.style.width='100%';clone.style.borderRight='none';nav.appendChild(clone);}
    document.body.appendChild(ov);document.body.appendChild(nav);
  }
  requestAnimationFrame(()=>{ov.classList.add('open');nav.classList.add('open');});
}
function closeMobileNav(){
  const ov=document.getElementById('mobileOverlay');const nav=document.getElementById('mobileNav');
  if(ov)ov.classList.remove('open');if(nav)nav.classList.remove('open');
}
(function(){
  const path=location.pathname.split('/').pop().replace('.html','');
  document.querySelectorAll('.mbb-item').forEach(a=>{if(a.dataset.page===path)a.classList.add('active');});
})();
</script>

<script>
window.toggleDrop=function(btn){
  const menu=btn.nextElementSibling
  const isOpen=menu.classList.contains('open')
  document.querySelectorAll('.hnav-menu.open').forEach(m=>m.classList.remove('open'))
  document.querySelectorAll('.hnl.open').forEach(b=>b.classList.remove('open'))
  if(!isOpen){menu.classList.add('open');btn.classList.add('open')}
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.hnav-drop')){
    document.querySelectorAll('.hnav-menu.open').forEach(m=>m.classList.remove('open'))
    document.querySelectorAll('.hnl.open').forEach(b=>b.classList.remove('open'))
  }
})
</script>
