<!doctype html>
<html lang="fr" data-mode="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IT Soluce ERP — Fournisseurs</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon_io/favicon.ico">
<script src="/assets/js/admin-security.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
:root{--a:#d68a4c;--ad:rgba(214,138,76,0.16);--bg:#1c1815;--bg2:#241f1a;--bg3:#2c2620;--bg4:#332c24;--ln:rgba(255,241,224,0.07);--ln2:rgba(255,241,224,0.12);--t1:#f2ece3;--t2:#b6ab9c;--t3:#7d7364;--ok:#6fac83;--w:#e0b34d;--d:#dd7c62;--sw:220px;--th:48px;}
[data-mode="light"]{--bg:#f7f3ec;--bg2:#fffdfa;--bg3:#efe8dd;--bg4:#e6dccb;--ln:rgba(60,40,20,0.08);--ln2:rgba(60,40,20,0.14);--t1:#241f1a;--t2:#6b5f4f;--t3:#a89a86;}
body{font-family:'IBM Plex Sans',-apple-system,sans-serif;background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:-.01em;}
.topbar{height:var(--th);background:var(--bg2);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100;}
.logo{display:flex;align-items:center;gap:7px;text-decoration:none;flex-shrink:0;}.logo-m{font-size:17px;font-weight:600;color:var(--a);letter-spacing:-1px;}.logo-sep{width:1px;height:14px;background:var(--ln2);}.logo-s{font-size:11px;font-weight:500;color:var(--t3);letter-spacing:2px;}
.tb-div{width:1px;height:18px;background:var(--ln2);flex-shrink:0;}.tb-badge{font-size:10px;font-weight:600;color:var(--a);background:var(--ad);padding:2px 7px;border-radius:3px;letter-spacing:.5px;}
.tb-crumb{font-size:12px;color:var(--t3);flex:1;display:flex;align-items:center;gap:6px;}.tb-crumb a{color:var(--t3);text-decoration:none;}.tb-crumb a:hover{color:var(--a);}.tb-crumb span{color:var(--t2);}
.tb-r{display:flex;align-items:center;gap:8px;margin-left:auto;}
.mstrip{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--ln2);border-radius:6px;padding:3px;gap:1px;}
.mbtn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:none;cursor:pointer;border-radius:4px;color:var(--t3);transition:all .12s;}.mbtn:hover{color:var(--t1);background:var(--bg4);}.mbtn.on{background:var(--ad);color:var(--a);}
.mbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.upill{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border:1px solid var(--ln2);border-radius:99px;background:var(--bg3);font-size:12px;color:var(--t2);}
.uav{width:22px;height:22px;border-radius:50%;background:var(--ad);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.bout{padding:5px 10px;border:1px solid var(--ln2);border-radius:5px;background:none;color:var(--t3);font-size:11px;font-family:inherit;cursor:pointer;transition:all .12s;}.bout:hover{color:var(--d);border-color:var(--d);}
.layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:var(--sw);background:var(--bg2);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:8px 0;display:none;}
.hnav{display:flex;align-items:center;gap:4px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--ln);flex-shrink:0;position:relative;}
.hnl{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;font-size:13px;color:var(--t2);text-decoration:none;cursor:pointer;border:none;background:none;font-family:inherit;white-space:nowrap;transition:all .1s;}
.hnl:hover{background:var(--bg3);color:var(--t1);}
.hnl.active{background:var(--ad);color:var(--a);}
.hnl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.hnl .chev{width:11px;height:11px;margin-left:1px;transition:transform .15s;}
.hnl.open .chev{transform:rotate(180deg);}
.hnav-drop{position:relative;}
.hnav-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--bg2);border:1px solid var(--ln2);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.24);min-width:230px;padding:8px;display:none;flex-direction:column;gap:2px;z-index:250;}
.hnav-menu.open{display:flex;animation:hnavIn .16s ease;}
@keyframes hnavIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.hnav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--t2);text-decoration:none;transition:background .12s;}
.hnav-item:hover{background:var(--bg3);color:var(--t1);}
.hnav-item.active{background:var(--ad);color:var(--a);font-weight:500;}
.hnav-item-ico{width:28px;height:28px;border-radius:8px;background:var(--bg3);color:var(--t3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hnav-item.active .hnav-item-ico{background:var(--bg4);color:var(--a);}
.hnav-item-ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.hnav-item .nc{margin-left:auto;font-size:10px;font-weight:600;min-width:16px;height:15px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--bg4);color:var(--t3);padding:0 4px;}
@media(max-width:900px){.hnav{display:none;}}

.ng{padding:14px 10px 4px;}.ngl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;padding:0 6px;margin-bottom:3px;}
.nl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:13px;color:var(--t2);text-decoration:none;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:all .1s;margin-bottom:1px;}
.nl:hover{background:var(--bg3);color:var(--t1);}.nl.active{background:var(--ad);color:var(--a);position:relative;}.nl.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--a);border-radius:0 2px 2px 0;}
.nl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.75;}.nl.active svg{opacity:1;}
.nc{margin-left:auto;font-size:10px;font-weight:600;min-width:18px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--bg4);color:var(--t3);padding:0 4px;}
.nhr{height:1px;background:var(--ln);margin:8px 10px;}.sf{margin-top:auto;padding:10px 16px;border-top:1px solid var(--ln);font-size:10px;color:var(--t3);}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.page-head{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.ph-left h1{font-size:18px;font-weight:600;color:var(--t1);letter-spacing:-.3px;}.ph-left p{font-size:12px;color:var(--t3);margin-top:2px;}
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;border:none;display:flex;align-items:center;gap:6px;}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary{background:var(--a);color:#fff;}.btn-primary:hover{opacity:.85;}
.btn-secondary{background:var(--bg3);color:var(--t2);border:1px solid var(--ln2);}.btn-secondary:hover{color:var(--t1);}
.btn-danger{background:rgba(248,113,113,.12);color:var(--d);border:1px solid rgba(248,113,113,.2);}
.kpi-strip{display:flex;gap:10px;padding:16px 24px 0;flex-shrink:0;}
.kpi{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:12px 16px;flex:1;}
.kpi-label{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.kpi-val{font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-1px;line-height:1;}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:3px;}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 24px;flex-shrink:0;}
.search-wrap{position:relative;flex:1;max-width:300px;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.search-input{width:100%;padding:7px 10px 7px 30px;background:var(--bg2);border:1px solid var(--ln2);border-radius:6px;color:var(--t1);font-size:12px;font-family:inherit;outline:none;transition:border-color .12s;}.search-input:focus{border-color:var(--a);}.search-input::placeholder{color:var(--t3);}
.filter-btn{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;border:1px solid var(--ln2);background:var(--bg2);color:var(--t2);transition:all .12s;white-space:nowrap;}
.filter-btn:hover{color:var(--t1);}.filter-btn.active{background:var(--a);color:#fff;border-color:var(--a);}
/* CARDS FOURNISSEURS */
.cards-wrap{flex:1;overflow-y:auto;padding:0 24px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;}
.four-card{background:var(--bg2);border:1px solid var(--ln);border-radius:10px;padding:18px;transition:border-color .15s;}
.four-card:hover{border-color:var(--a);}
.four-card.inactive{opacity:.5;}
.fc-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px;}
.fc-av{width:40px;height:40px;border-radius:8px;background:var(--ad);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;}
.fc-info{flex:1;min-width:0;}
.fc-name{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fc-cat{font-size:11px;color:var(--t3);margin-top:2px;}
.fc-actions{display:flex;gap:4px;flex-shrink:0;}
.act-btn{width:26px;height:26px;border-radius:4px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t3);transition:all .12s;}
.act-btn:hover{background:var(--bg3);color:var(--t1);}.act-btn.del:hover{background:rgba(248,113,113,.12);color:var(--d);}
.act-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.stars{display:flex;gap:2px;margin-bottom:12px;}
.star{font-size:13px;color:var(--w);}.star.off{color:var(--bg4);}
.fc-fields{display:flex;flex-direction:column;gap:6px;}
.fc-field{display:flex;align-items:center;gap:8px;font-size:12px;}
.fc-fl{color:var(--t3);width:80px;flex-shrink:0;font-size:11px;}
.fc-fv{color:var(--t1);}
.fc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln);}
.tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:3px;}
.tag-ok{background:rgba(52,211,153,.12);color:var(--ok);}
.tag-off{background:var(--bg4);color:var(--t3);}
.toggle-actif{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);cursor:pointer;}
.tog{width:30px;height:16px;border-radius:99px;background:var(--bg4);border:1px solid var(--ln2);position:relative;cursor:pointer;transition:all .2s;}
.tog.on{background:var(--ok);border-color:var(--ok);}
.tog-thumb{width:10px;height:10px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s;}
.tog.on .tog-thumb{transform:translateX(14px);}
.panel-overlay{display:none;}
.panel{position:fixed;left:0;right:0;top:0;bottom:0;width:auto;min-width:0;background:var(--bg);border-left:none;z-index:201;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}.panel.open{transform:translateX(0);}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.panel-title{font-size:14px;font-weight:600;color:var(--t1);}
.panel-close{width:28px;height:28px;border-radius:5px;border:none;background:var(--bg3);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}.panel-close:hover{background:var(--bg4);color:var(--t1);}
.panel-body{flex:1;overflow-y:auto;padding:32px 40px;}.panel-footer{padding:16px 40px;border-top:1px solid var(--ln);display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-shrink:0;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
.form-section{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:22px 26px;}
.form-section-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.form-section-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.form-section-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;}
.form-section-head span{font-size:14px;font-weight:600;color:var(--t1);}
.form-section .fg{margin-bottom:14px;}
.form-section .fg:last-child{margin-bottom:0;}
@media(max-width:1100px){.form-grid{grid-template-columns:1fr;max-width:640px;margin:0 auto;}}
.fg{margin-bottom:13px;}.fg label{display:block;font-size:11px;font-weight:500;color:var(--t2);margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--ln2);border-radius:5px;color:var(--t1);font-size:12px;font-family:inherit;outline:none;transition:border-color .12s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--a);}.fg textarea{resize:vertical;min-height:60px;}.fg select option{background:var(--bg3);}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fg-sep{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln);}
.fg-sep:first-child{margin-top:0;border-top:none;padding-top:0;}
.star-pick{display:flex;gap:4px;cursor:pointer;}.sp{font-size:20px;color:var(--bg4);transition:color .1s;}.sp.on{color:var(--w);}
.empty-grid{padding:60px 0;text-align:center;grid-column:1/-1;}
.empty-ico{font-size:32px;margin-bottom:12px;opacity:.4;}.empty-title{font-size:14px;font-weight:500;color:var(--t2);margin-bottom:6px;}.empty-sub{font-size:12px;color:var(--t3);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--ln2);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--t1);box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:999;transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}.toast.ok{border-color:rgba(52,211,153,.3);color:var(--ok);}.toast.err{border-color:rgba(248,113,113,.3);color:var(--d);}
.loader{display:flex;align-items:center;justify-content:center;height:100%;gap:8px;font-size:12px;color:var(--t3);}
.spin{width:14px;height:14px;border:1.5px solid var(--ln2);border-top-color:var(--a);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:640px){.sidebar{display:none;}.panel{width:100%;}.cards-wrap{grid-template-columns:1fr;}}

/* NOTIFICATIONS */
.notif-wrap{position:relative;}
.notif-bell{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--ln2);border-radius:8px;background:var(--bg3);color:var(--t2);cursor:pointer;transition:all .12s;position:relative;}
.notif-bell:hover{color:var(--t1);background:var(--bg4);}
.notif-bell svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.notif-count{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:99px;background:var(--d);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg2);}
.notif-count.hidden{display:none;}
.notif-panel{position:absolute;top:42px;right:0;width:340px;max-height:440px;background:var(--bg2);border:1px solid var(--ln2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:300;display:none;flex-direction:column;overflow:hidden;}
.notif-panel.open{display:flex;}
.notif-head{padding:12px 14px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.notif-title{font-size:13px;font-weight:600;color:var(--t1);}
.notif-clear{font-size:11px;color:var(--a);cursor:pointer;background:none;border:none;font-family:inherit;}
.notif-clear:hover{text-decoration:underline;}
.notif-list{flex:1;overflow-y:auto;}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);cursor:pointer;transition:background .1s;text-decoration:none;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--bg3);}
.notif-ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.ni-new{background:rgba(59,130,246,.15);}
.ni-stock{background:rgba(251,191,36,.15);}
.ni-time{background:rgba(248,113,113,.15);}
.ni-task{background:rgba(52,211,153,.15);}
.notif-body{flex:1;min-width:0;}
.notif-txt{font-size:12px;color:var(--t1);line-height:1.4;}
.notif-sub{font-size:11px;color:var(--t3);margin-top:2px;}
.notif-empty{padding:36px 14px;text-align:center;color:var(--t3);font-size:12px;}
.notif-empty-ico{font-size:24px;margin-bottom:8px;opacity:.4;}


/* ═══ SYSTÈME MOBILE ERP ═══ */
.mobile-menu-btn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--ln2);border-radius:9px;background:var(--bg3);color:var(--t1);cursor:pointer;flex-shrink:0;}
.mobile-menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;opacity:0;transition:opacity .2s;}
.mobile-overlay.open{display:block;opacity:1;}
.mobile-nav{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--bg2);z-index:401;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding:16px 0;box-shadow:2px 0 20px rgba(0,0,0,.3);}
.mobile-nav.open{transform:translateX(0);}
.mobile-nav-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px 16px;border-bottom:1px solid var(--ln);margin-bottom:12px;}
.mobile-nav-head img{height:30px;border-radius:6px;}
.mobile-nav-close{width:32px;height:32px;border:none;background:var(--bg3);border-radius:8px;color:var(--t2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mobile-bottombar{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg2);border-top:1px solid var(--ln);z-index:300;padding-bottom:env(safe-area-inset-bottom);}
.mobile-bottombar-inner{display:flex;height:60px;}
.mbb-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t3);text-decoration:none;font-size:9px;font-weight:500;transition:color .12s;}
.mbb-item.active{color:var(--a);}
.mbb-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}

@media(max-width:640px){
  .mobile-menu-btn{display:flex;}
  .mobile-bottombar{display:block;}
  .content{padding-bottom:70px !important;}
  /* Topbar allégée */
  .tb-badge,.tb-crumb,.tb-div{display:none !important;}
  .upill span{display:none !important;}
  .topbar{padding:0 12px !important;gap:8px !important;}
  .mstrip{display:none !important;}
  /* Contenu plein largeur */
  .content{padding-left:14px !important;padding-right:14px !important;}

<script>
function applyMode(m){const e=(m==='auto')?(new Date().getHours()>=7&&new Date().getHours()<20?'light':'dark'):m;document.documentElement.setAttribute('data-mode',e);const lv=e==='light';const v=(a,b)=>lv?a:b;}
function setMode(m){localStorage.setItem('erp-m',m);document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on',b.dataset.m===m));applyMode(m);}
const sm=localStorage.getItem('erp-m')||'auto';document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on',b.dataset.m===sm));applyMode(sm);
setInterval(()=>{if((localStorage.getItem('erp-m')||'auto')==='auto')applyMode('auto');},60000);
function showToast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type==='ok'?'ok':'err');setTimeout(()=>t.className='toast',3000);}
let currentNote=3
function setNote(n){
  currentNote=n
  document.getElementById('f-note').value=n
  document.querySelectorAll('.sp').forEach((s,i)=>s.classList.toggle('on',i<n))
}
function toggleActif(){
  const tog=document.getElementById('togActif')
  const inp=document.getElementById('f-actif')
  const isOn=inp.value==='true'
  inp.value=String(!isOn)
  tog.classList.toggle('on',!isOn)
}
let activeFilter='tous'
function setFilter(f){
  activeFilter=f
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'))
  document.getElementById('f-'+f).classList.add('active')
  window.renderCards&&window.renderCards()
}
function openPanel(f=null){
  document.getElementById('panelTitle').textContent=f?'Modifier le fournisseur':'Ajouter un fournisseur'
  document.getElementById('saveBtn').textContent=f?'Mettre à jour':'Enregistrer'
  document.getElementById('f-id').value=f?.id||''
  document.getElementById('f-nom').value=f?.nom||''
  document.getElementById('f-cat').value=f?.categorie||''
  document.getElementById('f-contact').value=f?.contact||''
  document.getElementById('f-email').value=f?.email||''
  document.getElementById('f-tel').value=f?.telephone||''
  document.getElementById('f-site').value=f?.site_web||''
  document.getElementById('f-delai').value=f?.delai_livraison||'J+1'
  document.getElementById('f-notes').value=f?.notes||''
  const actif=f?.actif!==false
  document.getElementById('f-actif').value=String(actif)
  document.getElementById('togActif').classList.toggle('on',actif)
  setNote(f?.note||3)
  document.getElementById('overlay').classList.add('open')
  document.getElementById('panel').classList.add('open')
  document.getElementById('f-nom').focus()
}
function closePanel(){document.getElementById('overlay').classList.remove('open');document.getElementById('panel').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();})
</script>

      sb.from('demandes_formulaire').select('id,prenom,nom,appareil,vue,created_at')
    ]);
    const reps=rRep.data||[], stock=rStock.data||[], tasks=rTask.data||[], demandes=rDem.data||[];
    const notifs=[];
    const now=new Date();

    // Nouvelles demandes du formulaire (vue=false)
    demandes.filter(d=>d.vue===false).forEach(d=>{
      const nomComplet=[d.prenom,d.nom].filter(Boolean).join(' ')||'Visiteur';
      notifs.push({type:'new',ico:'🆕',cls:'ni-new',txt:`Nouvelle demande de ${nomComplet}`,sub:`${d.appareil||'Appareil'} · ${new Date(d.created_at).toLocaleDateString('fr-BE')}`,link:'/admin/demandes.html'});
    });

    // Réparations bloquées (statut recu depuis +3 jours et déjà vue)
    reps.filter(r=>r.statut==='recu'&&r.vue!==false).forEach(r=>{
      const days=Math.floor((now-new Date(r.created_at))/(1000*60*60*24));
      if(days>=3)notifs.push({type:'time',ico:'⏰',cls:'ni-time',txt:`${r.client_nom} en attente depuis ${days}j`,sub:`Statut « Reçu » non traité`,link:'/admin/reparations.html'});
    });

    // Stock rupture/faible
    stock.filter(p=>Number(p.quantite)===0).forEach(p=>{
      notifs.push({type:'stock',ico:'📦',cls:'ni-stock',txt:`Rupture : ${p.nom}`,sub:`Stock épuisé · à recommander`,link:'/admin/stock.html'});
    });
    stock.filter(p=>Number(p.quantite)>0&&Number(p.quantite)<=Number(p.seuil_alerte)).forEach(p=>{
      notifs.push({type:'stock',ico:'📦',cls:'ni-stock',txt:`Stock faible : ${p.nom}`,sub:`${p.quantite} restant(s) · seuil ${p.seuil_alerte}`,link:'/admin/stock.html'});
    });

    // Tâches urgentes
    tasks.filter(t=>!t.faite&&t.priorite==='urgente').forEach(t=>{
      notifs.push({type:'task',ico:'✅',cls:'ni-task',txt:t.titre,sub:'Tâche urgente non faite',link:'/admin/taches.html'});
    });

    renderNotifs(notifs);
  } catch(e){ console.warn('Notifs:',e); }
}

function renderNotifs(notifs){
  const count=document.getElementById('notifCount');
  const list=document.getElementById('notifList');
  if(!count||!list)return;
  // Le compteur ne compte que les nouvelles demandes (vue=false) + urgences
  const unread=notifs.filter(n=>n.type==='new').length;
  if(unread>0){count.textContent=unread;count.classList.remove('hidden');}
  else{count.classList.add('hidden');}
  if(notifs.length===0){
    list.innerHTML=`<div class="notif-empty"><div class="notif-empty-ico">🔔</div>Aucune notification</div>`;
    return;
  }
  list.innerHTML=notifs.map(n=>`<a href="${n.link}" class="notif-item"><div class="notif-ico ${n.cls}">${n.ico}</div><div class="notif-body"><div class="notif-txt">${escHtml(n.txt)}</div><div class="notif-sub">${escHtml(n.sub)}</div></div></a>`).join('');
}

window.renderCards=function(){

  })
  const wrap=document.getElementById('cardsWrap')

  wrap.innerHTML=rows.map(f=>{

          <button class="act-btn del" onclick="deleteFour(${f.id},'${escJsAttr(f.nom||'')}')" title="Supprimer"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
        </div>

      <div class="fc-fields">
        ${f.contact?`<div class="fc-field"><div class="fc-fl">Contact</div><div class="fc-fv">${escHtml(f.contact)}</div></div>`:''}
        ${f.email?`<div class="fc-field"><div class="fc-fl">Email</div><div class="fc-fv"><a href="mailto:${escHtml(f.email)}" style="color:var(--a);text-decoration:none;">${escHtml(f.email)}</a></div></div>`:''}

        ${f.site_web?`<div class="fc-field"><div class="fc-fl">Site</div><div class="fc-fv"><a href="${escHtml(f.site_web)}" target="_blank" style="color:var(--a);text-decoration:none;">Visiter →</a></div></div>`:''}
        ${f.delai_livraison?`<div class="fc-field"><div class="fc-fl">Délai</div><div class="fc-fv">${escHtml(f.delai_livraison)}</div></div>`:''}
        ${f.notes?`<div class="fc-field"><div class="fc-fl">Notes</div><div class="fc-fv" style="color:var(--t3);">${escHtml(f.notes)}</div></div>`:''}
      </div>

        <div class="toggle-actif" onclick="toggleActifDB(${f.id},${f.actif})">

window.editFour=function(id){
  const f=allFours.find(f=>f.id===id)
  if(f)openPanel(f)
}

window.toggleActifDB=async function(id,actuel){
  const {error}=await sb.from('fournisseurs').update({actif:!actuel,updated_at:new Date().toISOString()}).eq('id',id)
  if(error){showToast('Erreur : '+error.message,'err');return}
  const f=allFours.find(f=>f.id===id)
  if(f)f.actif=!actuel
  renderAll()
  showToast(!actuel?'Fournisseur activé ✓':'Fournisseur désactivé','ok')
}

window.deleteFour=async function(id,nom){
  if(!confirm(`Supprimer "${nom}" ?`))return
  const {error}=await sb.from('fournisseurs').delete().eq('id',id)
  if(error){showToast('Erreur : '+error.message,'err');return}
  allFours=allFours.filter(f=>f.id!==id)
  renderAll()
  showToast(`"${nom}" supprimé`,'ok')
}

window.saveFour=async function(){
  const id=document.getElementById('f-id').value
  const nom=document.getElementById('f-nom').value.trim()
  if(!nom){showToast('Le nom est requis','err');return}
  const payload={
    nom,
    categorie:document.getElementById('f-cat').value||null,
    contact:document.getElementById('f-contact').value.trim()||null,
    email:document.getElementById('f-email').value.trim()||null,
    telephone:document.getElementById('f-tel').value.trim()||null,
    site_web:document.getElementById('f-site').value.trim()||null,
    delai_livraison:document.getElementById('f-delai').value||null,
    note:Number(document.getElementById('f-note').value)||3,
    notes:document.getElementById('f-notes').value.trim()||null,
    actif:document.getElementById('f-actif').value==='true',
    updated_at:new Date().toISOString()
  }
  document.getElementById('saveBtn').textContent='Enregistrement...'
  document.getElementById('saveBtn').disabled=true
  let error
  if(id){
    const res=await sb.from('fournisseurs').update(payload).eq('id',id)
    error=res.error
    if(!error){const idx=allFours.findIndex(f=>f.id===Number(id));if(idx>=0)allFours[idx]={...allFours[idx],...payload}}
  } else {
    const res=await sb.from('fournisseurs').insert(payload).select().single()
    error=res.error
    if(!error&&res.data)allFours.unshift(res.data)
  }
  document.getElementById('saveBtn').textContent=id?'Mettre à jour':'Enregistrer'
  document.getElementById('saveBtn').disabled=false
  if(error){showToast('Erreur : '+error.message,'err');return}
  closePanel()
  renderAll()
  showToast(id?`"${nom}" mis à jour ✓`:`"${nom}" ajouté ✓`,'ok')
}

<script>
(function(){
  if(window.innerWidth>640)return;
  // Effet pression tactile sur les éléments interactifs
  document.addEventListener('touchstart',function(e){
    const t=e.target.closest('.btn,.mbb-item,.cat-opt,.drow,.nl,.kpi');
    if(t){t.style.transition='transform .1s';t.style.transform='scale(0.97)';}
  },{passive:true});
  document.addEventListener('touchend',function(e){
    document.querySelectorAll('.btn,.mbb-item,.cat-opt,.drow,.nl,.kpi').forEach(el=>{el.style.transform='';});
  },{passive:true});
})();
</script>

<script>
(function(){
  if(window.innerWidth>640)return;
  if(!document.startViewTransition)return; // navigateur non compatible -> navigation normale

  // Ordre des pages pour déterminer aller/retour (profondeur)
  const DEPTH={dashboard:0,reparations:1,stock:1,catalogue:1,clients:1,fournisseurs:1,devis:1,factures:1,garanties:1,charges:1,planning:1,taches:1,marketing:1,performance:1,relances:1,settings:1};
  function pageName(url){try{return (new URL(url,location.href)).pathname.split('/').pop().replace('.html','')||'dashboard';}catch(e){return '';}}
  const current=pageName(location.href);

  document.addEventListener('click',function(e){
    const a=e.target.closest('a[href]');
    if(!a)return;
    const href=a.getAttribute('href');
    // Ignorer liens externes, ancres, target _blank, mailto/tel
    if(!href||href.startsWith('#')||href.startsWith('http')||href.startsWith('mailto')||href.startsWith('tel')||a.target==='_blank')return;
    if(!href.includes('.html'))return;
    const dest=pageName(href);
    // Déterminer si c'est un retour (destination moins profonde)
    const isBack=(DEPTH[dest]??1)<(DEPTH[current]??1);
    e.preventDefault();
    if(isBack)document.documentElement.classList.add('back-nav');
    // Mémoriser le sens pour la page suivante
    try{sessionStorage.setItem('nav-back',isBack?'1':'0');}catch(e){}
    document.startViewTransition(()=>{window.location.href=href;});
  });

  // Au chargement : si on venait d'un "retour", appliquer le fondu à l'entrée
  try{
    if(sessionStorage.getItem('nav-back')==='1'){
      document.documentElement.classList.add('back-nav');
      sessionStorage.removeItem('nav-back');
      setTimeout(()=>document.documentElement.classList.remove('back-nav'),400);
    }
  }catch(e){}
})();
</script>
