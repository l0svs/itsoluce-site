<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Espace client — IT Soluce</title>
<link rel="icon" href="/favicon_io/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
<link href="/assets/fonts/inter.css?v=20261116" rel="stylesheet">
<style>
:root{--a:#0052CC;--t1:#1d1d1f;--t2:#6e6e73;--ln:#d2d2d7;--ln2:#e5e5ea;--bg:#f5f5f7;--ok:#1a8a52;--d:#c8362c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:var(--a)}
.nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;border-bottom:1px solid var(--ln2);font-size:13.5px}
.nav img{height:30px;display:block}.nav .g,.nav .d{flex:1;display:flex}.nav .d{justify-content:flex-end}
.nav a,.nav button{color:var(--a);text-decoration:none;background:none;border:none;font:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px}
h1{font-size:24px;font-weight:600;letter-spacing:-.4px;margin-bottom:6px}
.msub{font-size:14.5px;color:var(--t2);margin-bottom:18px}
.card{background:#fff;border:1px solid var(--ln2);border-radius:18px;padding:18px;margin-bottom:14px}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
.f input,.f textarea{width:100%;border:1px solid var(--ln);border-radius:11px;padding:12px;font-size:15px;font-family:inherit;color:var(--t1);background:#fff}
.f textarea{min-height:110px;resize:vertical}
.btn{display:block;width:100%;text-align:center;background:var(--a);color:#fff;border:none;border-radius:99px;padding:13px;font-size:14.5px;font-weight:500;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.o{background:#fff;color:var(--a);border:1px solid var(--a)}.btn.wa{background:#e9f8ef;color:#128c4a}
.btn:disabled{opacity:.6}
.note{font-size:13px;color:var(--t2);margin-top:12px;text-align:center}
.ok-msg{background:#e8f6ee;color:#14532d;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.err{color:var(--d);font-size:13.5px;margin-top:10px}
.pk-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.pk-h b{font-size:16px}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#e8f6ee;color:var(--ok);white-space:nowrap}
.badge.g{background:var(--bg);color:var(--t2)}.badge.d{background:#fdecea;color:var(--d)}
.big{font-size:36px;font-weight:600;letter-spacing:-1px;margin:12px 0 2px}.big small{font-size:15px;color:var(--t2);font-weight:500;letter-spacing:0}
.bar{height:8px;background:#eef0f4;border-radius:8px;overflow:hidden;margin:10px 0 8px}.bar span{display:block;height:100%;background:var(--a);border-radius:8px}
.meta{font-size:13px;color:var(--t2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.h3{font-size:14px;font-weight:600;margin-bottom:6px}
.hist{list-style:none}.hist li{padding:11px 0;border-top:1px solid #f0f0f2;font-size:14px}.hist li:first-child{border-top:none}
.hd{display:flex;justify-content:space-between;gap:8px;color:var(--t2);font-size:12.5px;margin-bottom:2px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#eef3fd;color:var(--a);white-space:nowrap}.chip.g{background:var(--bg);color:var(--t2)}
.doc{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:10px 0;border-top:1px solid #f0f0f2}.doc:first-of-type{border-top:none}
.doc button{background:none;border:none;color:var(--a);font:inherit;font-weight:500;cursor:pointer}
.vide{font-size:14px;color:var(--t2)}
.loader{text-align:center;padding:60px 0;color:var(--t2)}
/* ── Tableau de bord ── */
.wrap.db{max-width:1080px;padding:28px 20px 56px}
.db-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.db-h h1{font-size:30px;letter-spacing:-.6px;margin:0}
.db-h p{font-size:15px;color:var(--t2);margin-top:4px}
.db-g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.db-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.db-g .card{margin:0;padding:22px;border-radius:20px}
.ttl{font-size:15px;font-weight:600;letter-spacing:-.1px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.ttl small{font-size:12.5px;font-weight:500;color:var(--t2)}
/* carte pack */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px;color:#fff;background:linear-gradient(135deg,#0a4fd1 0%,#0052CC 45%,#003d99 100%);box-shadow:0 10px 30px -12px rgba(0,82,204,.55)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-t{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.hero-t b{font-size:18px;font-weight:600;letter-spacing:-.2px}
.hero-t span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
.etat{display:flex;gap:14px;align-items:center;background:#fff;color:var(--t1);border-radius:16px;padding:16px;margin:18px 0 16px;position:relative;z-index:1}
.etat i{flex-shrink:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e8f6ee;color:var(--ok)}
.etat i.u{background:#eef0f4;color:var(--t2)}
.etat b{display:block;font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.3}
.etat span{display:block;font-size:13.5px;color:var(--t2);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px}
.stat small{display:block;font-size:11.5px;opacity:.8;margin-bottom:2px}
.stat b{font-size:17px;font-weight:600;letter-spacing:-.2px}
.stat b em{font-style:normal;font-size:13px;font-weight:500;opacity:.75}
.mois{margin-top:16px;position:relative;z-index:1}
.mois small{display:block;font-size:11.5px;opacity:.8;margin-bottom:8px}
.mois ol{list-style:none;display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.mois li{height:8px;border-radius:8px;background:rgba(255,255,255,.22)}
.mois li.u{background:#fff}.mois li.c{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px #fff}.mois li.p{background:rgba(255,255,255,.08)}
.remise{display:inline-block;margin-top:14px;font-size:12.5px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;z-index:1}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts2 .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 12px}
/* historique */
.tl{list-style:none}
.tl li{display:flex;gap:14px;padding:14px 0;border-top:1px solid #f0f0f2}.tl li:first-child{border-top:none;padding-top:2px}
.tl i{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:#eef3fd;color:var(--a);display:flex;align-items:center;justify-content:center}
.tl .c{flex:1;min-width:0}
.tl .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tl .h b{font-size:14px;font-weight:600}
.tl .h em{font-style:normal;font-size:12.5px;color:var(--t2);white-space:nowrap}
.tl p{font-size:14px;color:#3a3a3c;margin-top:3px;overflow-wrap:anywhere}
.tl .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
/* documents */
.docs{list-style:none}
.docs li{border-top:1px solid #f0f0f2}.docs li:first-child{border-top:none}
.docs button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 0;background:none;border:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.docs i{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--bg);color:var(--t2);display:flex;align-items:center;justify-content:center}
.docs .c{flex:1;min-width:0}.docs b{display:block;font-size:14px;font-weight:600}.docs span{font-size:12.5px;color:var(--t2)}
.docs .m{font-size:14px;font-weight:600;white-space:nowrap}
.docs svg.ch{color:#c7c7cc;flex-shrink:0}
.docs button:hover b{color:var(--a)}
.pks{list-style:none}.pks li{padding:10px 0;border-top:1px solid #f0f0f2;font-size:14px}.pks li:first-child{border-top:none;padding-top:0}
.pks .h{display:flex;justify-content:space-between;gap:8px;align-items:center}.pks b{font-weight:600}
.contact a{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #f0f0f2;color:var(--t1);text-decoration:none;font-size:14px}
.contact a:first-of-type{border-top:none;padding-top:0}
.contact a i{width:34px;height:34px;border-radius:10px;background:#eef3fd;color:var(--a);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact a span{color:var(--t2);font-size:12.5px;display:block}
.vide2{font-size:14px;color:var(--t2);padding:4px 0}
@media(max-width:900px){.db-g{grid-template-columns:1fr}}
@media(max-width:560px){.wrap.db{padding:20px 14px 44px}.db-h h1{font-size:26px}.hero{padding:20px;border-radius:20px}
  .stats{gap:8px}.stat{padding:10px}.stat b{font-size:15px}.etat{padding:14px}.etat b{font-size:16px}.db-g .card{padding:18px}
  .acts2{grid-template-columns:1fr}}
.db-g>*{animation:heroIn .7s cubic-bezier(.22,.61,.36,1) both}.db-g>*:nth-child(2){animation-delay:.08s}
/* facture */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:16px;overflow:auto}
.ov.open{display:flex}
.fac{background:#fff;border-radius:16px;width:720px;max-width:100%;padding:28px;font-size:13.5px;color:#12212e}
.fac-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.fac-top img{height:34px}
.fac h2{font-size:20px;margin-bottom:2px}
.fac table{width:100%;border-collapse:collapse;margin:14px 0}
.fac th{text-align:left;font-size:11.5px;color:#5a6b7b;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid #e3e8ee;padding:6px 0}
.fac td{padding:9px 0;border-bottom:1px solid #e3e8ee;vertical-align:top}.fac .n{text-align:right;white-space:nowrap;padding-left:12px}
.fac .tot{font-size:16px;font-weight:700}
.fac .pied{font-size:12px;color:#5a6b7b;margin-top:16px}
.fac-acts{display:flex;gap:10px;margin-top:18px}.fac-acts .btn{width:auto;flex:1}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;background:none;padding:0;display:block}.fac{border-radius:0;width:auto;padding:0}.fac-acts{display:none}}

/* Animation d'ouverture : identique au site principal */
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap>*{animation:heroIn .7s cubic-bezier(.22,.61,.36,1) both}
.wrap>*:nth-child(2){animation-delay:.06s}.wrap>*:nth-child(3){animation-delay:.12s}.wrap>*:nth-child(4){animation-delay:.17s}
.wrap>*:nth-child(5){animation-delay:.22s}.wrap>*:nth-child(6){animation-delay:.27s}.wrap>*:nth-child(n+7){animation-delay:.3s}
.fac{animation:heroIn .45s cubic-bezier(.22,.61,.36,1) both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* Bouton « Retour au site » : noir sur blanc, discret */
.nav{position:relative}.nav>a:has(>img){position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

.nav a.retour{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 10px;border:1px solid #d2d2d7;border-radius:99px;background:#fff;color:#1d1d1f;font-size:13px;font-weight:500;text-decoration:none;transition:border-color .15s,background .15s}
.nav a.retour:hover{border-color:#1d1d1f;background:#f5f5f7}
.nav a.retour svg{flex-shrink:0}
@media(max-width:480px){.nav a.retour{padding:0 11px 0 8px;font-size:12.5px}}
</style>
</head>
<body>
<header class="nav">
  <div class="g"><a href="/" class="retour"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Retour au site</a></div>
  <a href="/"><img src="/img/logo-full.png" alt="IT Soluce"></a>
  <div class="d"><button id="deco" onclick="deconnexion()" hidden>Déconnexion</button></div>
</header>
<main class="wrap" id="app"><div class="loader">Chargement…</div></main>

<div class="ov" id="ovFac" onclick="if(event.target.id==='ovFac')fermerFac()"><div class="fac" id="fac"></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SB='https://esltsiutcjcwdbhkkvms.supabase.co'
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzbHRzaXV0Y2pjd2RiaGtrdm1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NjM2OTEsImV4cCI6MjA5NzMzOTY5MX0.Sl2cdnqEr7VSBeq1wwMBpfQW9yBB0IG9RkOiZi9GXvo'
// Session séparée de celle de l'ERP (clé de stockage distincte).
const sb=createClient(SB,SK,{auth:{storageKey:'itsoluce-espace',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})
const app=document.getElementById('app')
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
const EUR=new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'})
const eur=v=>EUR.format(Number(v)||0)
const dFr=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric'}):''
const dLong=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'}):''
const TYPES={domicile:'À domicile',travail:'Sur le lieu de travail',depot:"Dépôt à l'atelier"}
let donnees=null

const _q=new URLSearchParams(location.search)
const EMAIL_INVITE=(_q.get('email')||'').slice(0,160),BIENVENUE=_q.get('bienvenue')==='1'
if(_q.toString())history.replaceState(null,'',location.pathname+location.hash)
const dureeH=v=>{const m=Math.round((Number(v)||0)*60),h=Math.floor(m/60),r=m%60;return h?`${h} h${r?' '+String(r).padStart(2,'0'):''}`:`${r} min`}
function ecranConnexion(msg){
  document.getElementById('deco').hidden=true
  app.innerHTML=`<h1 style="margin-top:14px">Espace client</h1>
    <p class="msub">Entrez l'adresse e-mail utilisée pour votre Pack Sérénité : vous recevez un lien de connexion.<br>Pas de mot de passe.</p>
    ${BIENVENUE&&!msg?`<div class="card ok-msg" style="margin:0 0 14px">Merci pour votre achat.<br>Un lien de connexion vous a été envoyé par e-mail${EMAIL_INVITE?` à <b>${esc(EMAIL_INVITE)}</b>`:''} : ouvrez-le pour accéder à votre espace.<br>Vous ne le trouvez pas ? Demandez-en un nouveau ci-dessous.</div>`:''}
    <form class="card" id="fLien"><div class="f"><label for="em">E-mail</label><input id="em" type="email" autocomplete="email" required value="${esc(EMAIL_INVITE)}"></div>
      <button class="btn" id="bLien">Recevoir mon lien de connexion</button><div id="rLien">${msg?`<div class="err">${esc(msg)}</div>`:''}</div></form>
    <p class="note">Pas encore de pack ? <a href="/pack.html">Découvrir le Pack Sérénité</a></p>`
  document.getElementById('fLien').onsubmit=async e=>{
    e.preventDefault()
    const email=document.getElementById('em').value.trim(),b=document.getElementById('bLien'),r=document.getElementById('rLien')
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){r.innerHTML='<div class="err">Adresse e-mail invalide.</div>';return}
    b.disabled=true
    try{
      const res=await fetch(SB+'/functions/v1/pack',{method:'POST',headers:{'Content-Type':'application/json',apikey:SK,Authorization:'Bearer '+SK},body:JSON.stringify({action:'lien',email})})
      if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.error||'Erreur, réessayez.')}
      r.innerHTML=`<div class="ok-msg">Si cette adresse correspond à un Pack Sérénité, un lien de connexion vient de vous être envoyé.<br>Pensez à vérifier vos courriers indésirables.</div>`
    }catch(x){r.innerHTML=`<div class="err">${esc(x.message)}</div>`;b.disabled=false}
  }
}

// Anciennes formules (3, 6, 12 mois) : pièces −10 %. Nouvelles : −20 % sur la main-d'œuvre.
const ANCIENNES=['3m','6m','12m']
const remiseTxt=p=>ANCIENNES.includes(p.formule)?'Pièces détachées −10 %':(p.formule==='mobile'?"−20 % sur la main-d'œuvre des réparations":"−20 % sur la main-d'œuvre au-delà du pack")
const lendemain=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+1);return x.toISOString().slice(0,10)}
const veille=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
const dCourt=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('fr-BE',{day:'numeric',month:'short'}):''
const dMoisAn=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('fr-BE',{month:'long',year:'numeric'}):''
const ajMois=(d,k)=>{const [y,m,j]=d.split('-').map(Number);const fin=new Date(Date.UTC(y,m-1+k+1,0)).getUTCDate();return new Date(Date.UTC(y,m-1+k,Math.min(j,fin))).toISOString().slice(0,10)}
const I={
  ok:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  hor:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  domicile:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  travail:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
  depot:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  doc:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  ch:'<svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  tel:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.5c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg>',
  mail:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',

// Mois du pack (Famille / Pro) : utilisé, en cours, à venir.
function frise(p,journal){
  if(!p.date_debut||!p.date_fin)return ''
  const auj=new Date().toISOString().slice(0,10),cases=[]
  for(let k=0;k<24;k++){const deb=ajMois(p.date_debut,k);if(deb>=p.date_fin)break;const fin=ajMois(p.date_debut,k+1)
    const u=journal.some(j=>j.decompte&&j.date>=deb&&j.date<fin),c=auj>=deb&&auj<fin
    cases.push(`<li class="${u?'u':c?'c':auj>=fin?'p':''}" title="Mois ${k+1} : ${dCourt(deb)} → ${dCourt(veille(fin))}"></li>`)}
  return `<div class="mois"><small>Vos 12 mois · ${journal.filter(j=>j.decompte).length} intervention${journal.filter(j=>j.decompte).length>1?'s':''} utilisée${journal.filter(j=>j.decompte).length>1?'s':''}</small><ol>${cases.join('')}</ol></div>`
}
function cartePack(p){
  const e=p.etat,hRest=p.hydrogels_total-e.hydrogels_utilises
  let etat,stat1
  if(e.par_mois){
    etat=e.mois_utilisee
      ?`<i class="u">${I.hor}</i><div><b>Intervention du mois utilisée</b><span>La prochaine est disponible dès le ${dLong(lendemain(e.mois_fin))}.</span></div>`
      :`<i>${I.ok}</i><div><b>Votre intervention du mois est disponible</b><span>Du ${dCourt(e.mois_debut)} au ${dCourt(e.mois_fin)} ${String(e.mois_fin).slice(0,4)} · main-d'œuvre incluse</span></div>`
    stat1=`<div class="stat"><small>Interventions</small><b>${e.utilisees} <em>/ ${p.interventions_total}</em></b></div>`
  }else if(p.formule==='mobile'){
    etat=e.restantes>0
      ?`<i>${I.ok}</i><div><b>Transfert offert disponible</b><span>Vers votre prochain smartphone, quand vous le souhaitez.</span></div>`
      :`<i class="u">${I.ok}</i><div><b>Transfert offert utilisé</b><span>Diagnostic offert et −20 % sur la main-d'œuvre restent actifs.</span></div>`
    stat1=`<div class="stat"><small>Diagnostic</small><b>Offert</b></div>`
  }else{
    etat=`<i${e.restantes>0?'':' class="u"'}>${I.ok}</i><div><b>${e.restantes} intervention${e.restantes>1?'s':''} restante${e.restantes>1?'s':''}</b><span>sur ${p.interventions_total} incluses dans votre pack</span></div>`
    stat1=`<div class="stat"><small>Interventions</small><b>${e.utilisees} <em>/ ${p.interventions_total}</em></b></div>`
  }
  return `<section class="hero"><div class="hero-t"><b>${esc(p.nom)}</b><span>Actif</span></div>
    <div class="etat">${etat}</div>
    <div class="stats">${stat1}
      <div class="stat"><small>Hydrogel</small><b>${p.hydrogels_total?`${Math.max(0,hRest)} <em>/ ${p.hydrogels_total}</em>`:'—'}</b></div>
      <div class="stat"><small>Fin du pack</small><b>${dCourt(p.date_fin)} <em>${String(p.date_fin).slice(0,4)}</em></b></div></div>
    ${e.par_mois?frise(p,p.journal||[]):''}
    <span class="remise">${remiseTxt(p)}</span></section>`
}
function tableau(){
  document.getElementById('deco').hidden=false
  app.classList.add('db')
  const d=donnees,prenom=String(d.client.nom||'').split(' ')[0]
  const actifs=d.packs.filter(p=>p.statut==='actif'&&!p.etat.expire)
  const depuis=d.packs.filter(p=>p.date_debut).map(p=>p.date_debut).sort()[0]
  const journal=d.packs.flatMap(p=>p.journal.map(j=>({...j,pack:p.nom}))).sort((a,b)=>String(b.date).localeCompare(String(a.date)))
  const plusieurs=d.packs.length>1
  const histo=journal.length?`<ul class="tl">${journal.map(j=>`<li><i>${I[j.type]||I.depot}</i><div class="c">
      <div class="h"><b>${TYPES[j.type]||'Intervention'}</b><em>${dFr(j.date)}</em></div>
      <p>${esc(j.description)}</p>
      <div class="tags"><span class="chip${j.decompte?'':' g'}">${j.decompte?'Incluse dans le pack':'Hors pack'}</span>${j.hydrogels?`<span class="chip g">${j.hydrogels} hydrogel${j.hydrogels>1?'s':''} posé${j.hydrogels>1?'s':''}</span>`:''}${plusieurs?`<span class="chip g">${esc(j.pack)}</span>`:''}</div></div></li>`).join('')}</ul>`
    :'<p class="vide2">Aucune intervention pour le moment.<br>Quand vous avez besoin de moi, utilisez « Demander une intervention ».</p>'
  const docs=d.factures.length?`<ul class="docs">${d.factures.map(f=>`<li><button onclick="voirFacture(${f.id})"><i>${I.doc}</i><span class="c"><b>${f.type==='note_credit'?'Note de crédit':'Facture'} ${esc(f.numero)}</b><span>${dLong(f.date)}</span></span><span class="m">${eur(f.total)}</span>${I.ch}</button></li>`).join('')}</ul>`
    :'<p class="vide2">Aucun document.</p>'
  const mesPacks=`<ul class="pks">${d.packs.map(p=>{const e=p.etat
      const st=p.statut==='retracte'?['Rétracté','d']:p.statut==='annule'?['Annulé','d']:e.expire?['Terminé','g']:['En cours','']
      return `<li><div class="h"><b>${esc(p.nom)}</b><span class="badge ${st[1]}">${st[0]}</span></div><div class="meta">${p.date_debut?`Du ${dFr(p.date_debut)} au ${dFr(p.date_fin)}`:''}</div></li>`}).join('')}</ul>`
  app.innerHTML=`<div class="db-h"><div><h1>Bonjour ${esc(prenom)}</h1><p>${depuis?`Membre Sérénité depuis ${dMoisAn(depuis)}`:'Votre espace IT Soluce'}</p></div></div>
    <div class="db-g">
      <div class="db-col">
        ${actifs.map(cartePack).join('')||`<div class="card"><div class="ttl">Aucun pack actif</div><p class="vide2">Votre technicien attitré, toute l'année.</p><a class="btn" style="margin-top:14px" href="/pack.html">Découvrir le Pack Sérénité</a></div>`}
        ${actifs.length?`<div class="acts2"><button class="btn" onclick="ouvrirDemande()">${I.plus}Demander une intervention</button><a class="btn wa" href="https://wa.me/32474056659" target="_blank" rel="noopener">${I.wa}Écrire sur WhatsApp</a></div><div id="demande"></div>`:''}
        <div class="card"><div class="ttl">Historique des interventions${journal.length?`<small>${journal.length}</small>`:''}</div>${histo}</div>
      </div>
      <div class="db-col">
        <div class="card"><div class="ttl">Mes documents</div>${docs}</div>
        ${d.packs.length?`<div class="card"><div class="ttl">Mes packs</div>${mesPacks}</div>`:''}
        <div class="card contact"><div class="ttl">Besoin d'aide ?</div>
          <a href="tel:+32474056659"><i>${I.tel}</i><div>+32 474 05 66 59<span>Appel ou SMS</span></div></a>
          <a href="mailto:contact@itsoluce.be"><i>${I.mail}</i><div>contact@itsoluce.be<span>Réponse rapide</span></div></a>
          <a href="https://wa.me/32474056659" target="_blank" rel="noopener"><i>${I.wa}</i><div>WhatsApp<span>Photos de la panne bienvenues</span></div></a>
        </div>
      </div>
    </div>`
}
window.ouvrirDemande=function(){
  const el=document.getElementById('demande')
  el.innerHTML=`<form class="card" id="fDem" style="margin:0"><div class="f"><label for="msg">Votre demande (appareil, problème, disponibilités)</label><textarea id="msg" maxlength="1500" required></textarea></div>
    <button class="btn" id="bDem">Envoyer la demande</button><div id="rDem"></div></form>`
  document.getElementById('msg').focus()
  document.getElementById('fDem').onsubmit=async e=>{
    e.preventDefault();const b=document.getElementById('bDem'),r=document.getElementById('rDem');b.disabled=true
    const {error}=await sb.rpc('espace_demande',{p_message:document.getElementById('msg').value})
    if(error){r.innerHTML=`<div class="err">${esc(error.message)}</div>`;b.disabled=false;return}
    el.innerHTML='<div class="card"><div class="ok-msg" style="margin:0">Demande envoyée.<br>Je vous recontacte rapidement pour fixer un rendez-vous.</div></div>'
  }
}
window.voirFacture=async function(id){
  const {data:f,error}=await sb.rpc('espace_facture',{p_id:id})
  if(error||!f){alert('Document introuvable.');return}
  const en=f.entreprise||{},nc=f.type==='note_credit'
  const mention=!en.finance_mention_tva||/^TVA non applicable,? (art\.|article) 56bis/i.test(en.finance_mention_tva)?'Régime particulier de franchise des petites entreprises':en.finance_mention_tva
  document.getElementById('fac').innerHTML=`<div class="fac-top"><div><img src="/img/logo-full.png" alt="IT Soluce"><div style="margin-top:8px">${esc(en.entreprise_nom||'IT Soluce')}<br>${esc(en.entreprise_adresse||'')}<br>${en.entreprise_bce?'N° d\'entreprise : '+esc(en.entreprise_bce)+'<br>':''}${esc(en.entreprise_telephone||'')} · ${esc(en.entreprise_email||'')}</div></div>
    <div style="text-align:right"><h2>${nc?'Note de crédit':'Facture'} ${esc(f.numero)}</h2>Date : ${dFr(f.date_emission)}${f.origine?`<br>Sur la facture ${esc(f.origine)}`:''}${!nc&&f.statut==='payee'&&f.date_paiement?`<br>Payée le ${dFr(f.date_paiement)}`:''}</div></div>
    <div><b>Client</b><br>${f.client_societe?esc(f.client_societe)+'<br>':''}${esc(f.client_nom)}<br>${esc(f.client_adresse||'')}${f.client_tva?'<br>TVA : '+esc(f.client_tva):''}</div>
    <table><tr><th>Description</th><th class="n">Qté</th><th class="n">Prix</th><th class="n">Total</th></tr>
    ${(f.lignes||[]).map(l=>`<tr><td>${esc(l.description)}</td><td class="n">${l.unite==='h'?dureeH(l.quantite):esc(l.quantite)}</td><td class="n">${eur(l.prix_unitaire)}${l.unite==='h'?'/h':''}</td><td class="n">${eur(l.total)}</td></tr>`).join('')}
    ${Number(f.remise)>0?`<tr><td colspan="3">Remise</td><td class="n">− ${eur(f.remise)}</td></tr>`:''}
    <tr><td colspan="3" class="tot">Total</td><td class="n tot">${eur(f.total)}</td></tr></table>
    ${f.motif_credit?`<div>Motif : ${esc(f.motif_credit)}</div>`:''}
    <div class="pied">${esc(mention)}.<br>Copie consultable en ligne de votre ${nc?'note de crédit':'facture'}.</div>
    <div class="fac-acts"><button class="btn o" onclick="fermerFac()">Fermer</button><button class="btn" onclick="window.print()">Imprimer / PDF</button></div>`
  document.getElementById('ovFac').classList.add('open')
}
window.fermerFac=()=>document.getElementById('ovFac').classList.remove('open')
window.deconnexion=async()=>{await sb.auth.signOut();donnees=null;app.classList.remove('db');ecranConnexion()}

async function charger(){
  const {data,error}=await sb.rpc('espace_donnees')
  if(error)throw new Error(error.message)
  if(!data){await sb.auth.signOut();ecranConnexion("Ce compte n'est relié à aucun Pack Sérénité. Utilisez l'adresse e-mail donnée lors de l'achat.");return}
  donnees=data;tableau()
}
async function demarrer(){
  const h=new URLSearchParams(location.hash.slice(1))
  const t=h.get('t')
  if(t){
    history.replaceState(null,'',location.pathname)
    const {error}=await sb.auth.verifyOtp({token_hash:t,type:'magiclink'})
    if(error)return ecranConnexion('Ce lien a expiré ou a déjà été utilisé. Demandez-en un nouveau ci-dessous.')
  }
  const {data:{session}}=await sb.auth.getSession()
  if(!session)return ecranConnexion()
  try{await charger()}catch(e){ecranConnexion('Erreur de chargement : '+e.message)}
}
demarrer()
